<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title id="page-title">Product · HUSBA Beads</title>
<meta name="description" id="page-description" content="Handmade beaded jewellery by HUSBA Beads." />
<link rel="stylesheet" href="/assets/css/public.css" />
<link rel="icon" href="/assets/media/brand/favicon.svg" type="image/svg+xml">
</head>
<body data-husba-public>
<a href="#main" class="hb-skip">Skip to content</a>
<site-header></site-header>
<main id="main">
  <section class="hb-section hb-section--tight">
    <div class="hb-wrap">
      <nav aria-label="Breadcrumb" style="margin-bottom:1.5rem;font-size:var(--step-1);color:var(--ink-faint);">
        <a href="/collections/">← Back to collections</a>
      </nav>

      <div id="product-loading">
        <div class="hb-product">
          <div class="hb-skeleton" style="aspect-ratio:1;"></div>
          <div>
            <div class="hb-skeleton" style="height:2rem;width:70%;margin-bottom:0.75rem;"></div>
            <div class="hb-skeleton" style="height:1.5rem;width:40%;margin-bottom:1.5rem;"></div>
            <div class="hb-skeleton" style="height:6rem;"></div>
          </div>
        </div>
      </div>

      <article class="hb-product" id="product-content" hidden>
        <div class="hb-gallery">
          <div class="hb-gallery__stage" id="gallery-stage"></div>
          <div class="hb-gallery__thumbs" id="gallery-thumbs"></div>
        </div>
        <div class="hb-product__info">
          <p class="hb-eyebrow">A piece of HUSBA</p>
          <h1 id="product-name"></h1>
          <p class="hb-product__price" id="product-price"></p>
          <p class="hb-product__availability" id="product-availability"></p>
          <p class="hb-product__desc" id="product-desc"></p>
          <dl class="hb-product__facts" id="product-facts" hidden></dl>
          <div class="hb-product__cta">
            <a class="hb-btn hb-btn--whatsapp" id="cta-whatsapp" data-whatsapp="919326840719" href="#">Ask on WhatsApp</a>
            <a class="hb-btn hb-btn--primary" id="cta-enquire" href="/contact/">Send an enquiry</a>
          </div>
        </div>
      </article>

      <p id="product-error" class="hb-error" hidden>We couldn't find that piece — it may have sold out or moved. <a href="/collections/">Browse the full collection</a>.</p>
    </div>
  </section>
</main>
<site-footer></site-footer>
<script src="/config.js"></script>
<script type="module" src="/assets/js/components/site-header.js"></script>
<script type="module" src="/assets/js/components/site-footer.js"></script>
<script type="module" src="/assets/js/public/product.js"></script>
</body>
</html>
